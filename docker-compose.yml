name: netex-map

services:
  timetable-db:
    image: postgis/postgis:18-3.6-alpine
    restart: always
    container_name: ${DB_CONTAINER_NAME}
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_ADMIN_USERNAME}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD}
    ports:
      - ${DB_HOST_PORT}:5432
    volumes:
      - timetable-db:/var/lib/postgresql
      - ${DB_INIT_SCRIPTS_HOST_PATH}:/docker-entrypoint-initdb.d/
    shm_size: '2.1gb'
    logging:
      driver: local
      options:
        max-size: 25m
        max-file: 4

  timetable-api:
    build:
      context: ./map-api
      dockerfile: Dockerfile
    image: timetable-api:${BE_API_VERSION}
    restart: always
    container_name: ${BE_CONTAINER_NAME}
    depends_on:
      - timetable-db
    environment:
      MAP_LOD_CITY_LINES_ZOOM_THRESHOLD: ${BE_LOD_CITY_LINES_ZOOM_THRESHOLD}
      SPRING_DATASOURCE_URL: ${BE_SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USER: ${DB_ADMIN_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_ADMIN_PASSWORD}
      SERVER_SERVLET_CONTEXT-PATH: ${FE_API_URN}
    ports:
      - ${BE_HOST_PORT}:8080
    logging:
      driver: local
      options:
        max-size: 25m
        max-file: 4

  osm-download:
    image: alpine:latest
    restart: on-failure:3
    container_name: ${DATA_IMPORT_CONTAINER_NAME}-osm
    environment:
      OSM_MODE: true
      FORCE_DOWNLOAD: ${DATA_IMPORT_FORCE_DOWNLOAD}
      FORCE_SERVER_LOAD: ${DATA_IMPORT_FORCE_SERVER_LOAD}
      DATA_DIR: ${DATA_IMPORT_VOLUME_DIR}
      OSM_PBF_URL: ${DATA_IMPORT_OSM_PBF_URL}
      OSM_PBF_FILE_NAME: ${DATA_IMPORT_OSM_PBF_FILE_NAME}
    volumes:
      - data-sources:${DATA_IMPORT_VOLUME_DIR}
      - ${DATA_IMPORT_SCRIPT_HOST_PATH}:/app/entry.sh:ro
    entrypoint: ["/bin/sh", "/app/entry.sh"]
    logging:
      driver: local
      options:
        max-size: 25m
        max-file: 4

  timetable-import:
    image: timetable-api:${BE_API_VERSION}
    restart: on-failure:3
    container_name: ${DATA_IMPORT_CONTAINER_NAME}
    depends_on:
      osm-download:
        condition: service_completed_successfully
      timetable-api:
        condition: service_started
    environment:
      JAVA_TOOL_OPTIONS: ${DATA_IMPORT_JAVA_TOOL_OPTIONS}
      SPRING_DATASOURCE_URL: ${BE_SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USER: ${DB_ADMIN_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_ADMIN_PASSWORD}
      FORCE_DOWNLOAD: ${DATA_IMPORT_FORCE_DOWNLOAD}
      FORCE_SERVER_LOAD: ${DATA_IMPORT_FORCE_SERVER_LOAD}
      DATA_DIR: ${DATA_IMPORT_VOLUME_DIR}
      NETEX_PUBLIC_LINES_URL: ${DATA_IMPORT_NETEX_PUBLIC_LINES_URL}
      NETEX_CITY_LINES_URL: ${DATA_IMPORT_NETEX_CITY_LINES_URL}
      JRUTIL_GTFS_URL: ${DATA_IMPORT_JRUTIL_GTFS_URL}
      OSM_PBF_URL: ${DATA_IMPORT_OSM_PBF_URL}
      OSM_PBF_FILE_NAME: ${DATA_IMPORT_OSM_PBF_FILE_NAME}
      ROUTING_SERVICE_URL: ${BE_ROUTING_SERVICE_URL}
    volumes:
      - data-sources:${DATA_IMPORT_VOLUME_DIR}
      - ${DATA_IMPORT_SCRIPT_HOST_PATH}:/app/entry.sh:ro
    entrypoint: ["/bin/sh", "/app/entry.sh"]
    logging:
      driver: local
      options:
        max-size: 25m
        max-file: 4

  graphhopper:
    image: israelhikingmap/graphhopper:11.0
    restart: no
    container_name: ${GRAPHHOPPER_CONTAINER_NAME}
    depends_on:
      osm-download:
        condition: service_completed_successfully
    command: >
      --input ${DATA_IMPORT_OSM_PBF_CONTAINER_PATH}
    ports:
      - ${GRAPHHOPPER_HOST_PORT}:8989
    volumes:
      - routing-cache:/data
      - data-sources:${DATA_IMPORT_VOLUME_DIR}:ro
    logging:
      driver: local
      options:
        max-size: 25m
        max-file: 4

  reverse-proxy:
    build:
      context: .
      dockerfile: map/Dockerfile
      args:
        FE_INITIAL_MOMENT: ${FE_INITIAL_MOMENT}
        FE_CITY_LINES_ZOOM_THRESHOLD: ${FE_CITY_LINES_ZOOM_THRESHOLD}
        FE_API_URN: ${FE_API_URN}
        PROXY_HTML_CONTAINER_PATH: ${PROXY_HTML_CONTAINER_PATH}
        FE_FIT_CVUT_URL: ${FE_FIT_CVUT_URL}
        FE_ODL_URL: ${FE_ODL_URL}
        FE_PROFINIT_URL: ${FE_PROFINIT_URL}
        FE_GITHUB_REPO_URL: ${FE_GITHUB_REPO_URL}
        FE_JRUTIL_URL: ${FE_JRUTIL_URL}
        FE_PID_MAP_URL: ${FE_PID_MAP_URL}
        FE_CZECH_NETEX_DATA_URL: ${FE_CZECH_NETEX_DATA_URL}
        FE_JRUTIL_DATA_URL: ${FE_JRUTIL_DATA_URL}
        FE_OSM_URL: ${FE_OSM_URL}
        FE_CZECH_OSM_DATA_URL: ${FE_CZECH_OSM_DATA_URL}
        FE_GRAPHHOPER_URL: ${FE_GRAPHHOPER_URL}
        FE_AUTHOR_URL: ${FE_AUTHOR_URL}
    image: web-map:${FE_VERSION}
    pull_policy: build
    container_name: ${PROXY_CONTAINER_NAME}
    restart: always
    ports:
      - ${PROXY_HOST_PORT}:80
    volumes:
      - ${PROXY_CONFIG_HOST_PATH}:/etc/nginx/nginx.conf:ro
      - ${PROXY_CONFIG_TEMPLATES_HOST_PATH}:/etc/nginx/templates/:ro
    environment:
      HTML_CONTAINER_PATH: ${PROXY_HTML_CONTAINER_PATH}
      API_URL: ${BE_CONTAINER_NAME}:8080
      API_URN: ${FE_API_URN}
    logging:
      driver: local
      options:
        max-size: 25m
        max-file: 4

volumes:
  data-sources:
    name: ${DATA_SOURCES_VOLUME_NAME}
  timetable-db:
    name: ${DB_VOLUME_NAME}
  routing-cache:
    name: ${GRAPHHOPPER_VOLUME_NAME}
